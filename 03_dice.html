<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블록 블래스트 (Block Blast)</title>
    <style>
        body {
            background-color: #121213;
            color: #ffffff;
            font-family: 'Pretendard', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .score-board {
            font-size: 24px;
            font-weight: bold;
            color: #f39c12;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 40px);
            grid-template-rows: repeat(8, 40px);
            gap: 4px;
            background-color: #2a2a2c;
            padding: 8px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .cell {
            width: 40px;
            height: 40px;
            background-color: #3a3a3c;
            border-radius: 4px;
            transition: background-color 0.15s ease;
        }

        .cell.filled {
            background-color: #3498db;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.3);
        }

        .cell.highlight {
            background-color: #e74c3c;
            opacity: 0.6;
        }

        #block-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 360px;
            height: 120px;
            margin-top: 25px;
            background-color: #1e1e20;
            border-radius: 10px;
            padding: 10px;
        }

        .block-preview {
            display: grid;
            gap: 2px;
            cursor: grab;
        }

        .block-preview .mini-cell {
            width: 20px;
            height: 20px;
            border-radius: 2px;
        }

        .block-preview .mini-cell.filled {
            background-color: #3498db;
        }

        .block-preview.dragging {
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>BLOCK BLAST</h1>
        <div class="score-board">점수: <span id="score">0</span></div>
    </div>

    <div id="board"></div>

    <div id="block-container"></div>

    <script>
        const BOARD_SIZE = 8;
        const boardElement = document.getElementById('board');
        const containerElement = document.getElementById('block-container');
        const scoreElement = document.getElementById('score');

        let grid = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
        let score = 0;
        let draggedBlockIndex = null;

        // 사용될 블록 모양 정의 (1=블록, 0=빈공간)
        const BLOCK_SHAPES = [
            [[1]], // 1x1
            [[1, 1]], // 1x2
            [[1], [1]], // 2x1
            [[1, 1, 1]], // 1x3
            [[1], [1], [1]], // 3x1
            [[1, 1], [1, 1]], // 2x2
            [[1, 1, 1], [1, 1, 1], [1, 1, 1]], // 3x3
            [[1, 0], [1, 0], [1, 1]], // L 모양
            [[0, 1], [0, 1], [1, 1]], // 역 L 모양
            [[1, 1, 1], [0, 1, 0]] // T 모양
        ];

        // 보드 초기화
        function initBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    cell.addEventListener('dragover', handleDragOver);
                    cell.addEventListener('dragleave', handleDragLeave);
                    cell.addEventListener('drop', handleDrop);

                    boardElement.appendChild(cell);
                }
            }
            renderBoard();
            spawnBlocks();
        }

        // 보드 상태 렌더링
        function renderBoard() {
            const cells = boardElement.children;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const index = r * BOARD_SIZE + c;
                    if (grid[r][c] === 1) {
                        cells[index].classList.add('filled');
                    } else {
                        cells[index].classList.remove('filled');
                    }
                }
            }
        }

        // 하단에 배치할 3개 블록 생성
        function spawnBlocks() {
            containerElement.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const shape = BLOCK_SHAPES[Math.floor(Math.random() * BLOCK_SHAPES.length)];
                createBlockElement(shape, i);
            }
        }

        // 드래그 가능한 블록 UI 생성
        function createBlockElement(shape, index) {
            const blockDiv = document.createElement('div');
            blockDiv.classList.add('block-preview');
            blockDiv.draggable = true;
            blockDiv.dataset.index = index;

            blockDiv.style.gridTemplateColumns = `repeat(${shape[0].length}, 20px)`;
            blockDiv.style.gridTemplateRows = `repeat(${shape.length}, 20px)`;

            shape.forEach(row => {
                row.forEach(val => {
                    const miniCell = document.createElement('div');
                    miniCell.classList.add('mini-cell');
                    if (val === 1) miniCell.classList.add('filled');
                    blockDiv.appendChild(miniCell);
                });
            });

            blockDiv.addEventListener('dragstart', (e) => {
                draggedBlockIndex = index;
                e.dataTransfer.setData('text/plain', JSON.stringify(shape));
                blockDiv.classList.add('dragging');
            });

            blockDiv.addEventListener('dragend', () => {
                blockDiv.classList.remove('dragging');
                clearHighlights();
            });

            containerElement.appendChild(blockDiv);
        }

        // 드래그 위로 올라왔을 때 미리보기 표시
        function handleDragOver(e) {
            e.preventDefault();
            clearHighlights();

            const r = parseInt(e.target.dataset.row);
            const c = parseInt(e.target.dataset.col);
            const shape = getActiveShape();

            if (shape && canPlace(shape, r, c)) {
                highlightCells(shape, r, c);
            }
        }

        function handleDragLeave() {
            clearHighlights();
        }

        // 블록을 놓았을 때 배치 처리
        function handleDrop(e) {
            e.preventDefault();
            clearHighlights();

            const r = parseInt(e.target.dataset.row);
            const c = parseInt(e.target.dataset.col);
            const shape = getActiveShape();

            if (shape && canPlace(shape, r, c)) {
                placeBlock(shape, r, c);
                
                // 사용한 블록 제거
                const draggedBlock = containerElement.querySelector(`[data-index="${draggedBlockIndex}"]`);
                if (draggedBlock) draggedBlock.style.visibility = 'hidden';

                checkLineClears();
                
                // 3개 블록을 모두 사용했으면 새로 생성
                const remaining = Array.from(containerElement.children).filter(el => el.style.visibility !== 'hidden');
                if (remaining.length === 0) {
                    spawnBlocks();
                }
            }
        }

        function getActiveShape() {
            const draggedBlock = containerElement.querySelector(`.dragging`);
            if (!draggedBlock) return null;
            
            // 프리뷰 상의 노드 구조에서 형태 복원
            const rows = draggedBlock.style.gridTemplateRows.split(' ').length;
            const cols = draggedBlock.style.gridTemplateColumns.split(' ').length;
            const cells = Array.from(draggedBlock.children);
            
            let shape = [];
            for(let r=0; r<rows; r++) {
                let row = [];
                for(let c=0; c<cols; c++) {
                    row.push(cells[r * cols + c].classList.contains('filled') ? 1 : 0);
                }
                shape.push(row);
            }
            return shape;
        }

        function canPlace(shape, r, c) {
            for (let row = 0; row < shape.length; row++) {
                for (let col = 0; col < shape[row].length; col++) {
                    if (shape[row][col] === 1) {
                        const targetR = r + row;
                        const targetC = c + col;
                        if (targetR >= BOARD_SIZE || targetC >= BOARD_SIZE || grid[targetR][targetC] === 1) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function placeBlock(shape, r, c) {
            let placedCount = 0;
            for (let row = 0; row < shape.length; row++) {
                for (let col = 0; col < shape[row].length; col++) {
                    if (shape[row][col] === 1) {
                        grid[r + row][c + col] = 1;
                        placedCount++;
                    }
                }
            }
            score += placedCount * 10;
            updateScore();
            renderBoard();
        }

        function highlightCells(shape, r, c) {
            const cells = boardElement.children;
            for (let row = 0; row < shape.length; row++) {
                for (let col = 0; col < shape[row].length; col++) {
                    if (shape[row][col] === 1) {
                        const targetR = r + row;
                        const targetC = c + col;
                        const index = targetR * BOARD_SIZE + targetC;
                        if (cells[index]) cells[index].classList.add('highlight');
                    }
                }
            }
        }

        function clearHighlights() {
            const cells = boardElement.children;
            for (let cell of cells) {
                cell.classList.remove('highlight');
            }
        }

        // 가로/세로 줄 지우기 검사
        function checkLineClears() {
            let rowsToClear = [];
            let colsToClear = [];

            // 가로 줄 확인
            for (let r = 0; r < BOARD_SIZE; r++) {
                if (grid[r].every(val => val === 1)) {
                    rowsToClear.push(r);
                }
            }

            // 세로 줄 확인
            for (let c = 0; c < BOARD_SIZE; c++) {
                let isFull = true;
                for (let r = 0; r < BOARD_SIZE; r++) {
                    if (grid[r][c] === 0) {
                        isFull = false;
                        break;
                    }
                }
                if (isFull) colsToClear.push(c);
            }

            // 줄 지우기 및 점수 추가
            let linesCleared = rowsToClear.length + colsToClear.length;

            rowsToClear.forEach(r => grid[r].fill(0));
            colsToClear.forEach(c => {
                for (let r = 0; r < BOARD_SIZE; r++) grid[r][c] = 0;
            });

            if (linesCleared > 0) {
                score += linesCleared * 100; // 줄당 100점
                updateScore();
                renderBoard();
            }
        }

        function updateScore() {
            scoreElement.innerText = score;
        }

        initBoard();
    </script>
</body>
</html>
