<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스네이크 게임 (Snake Game)</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Pretendard', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .score-board {
            font-size: 20px;
            margin-top: 5px;
            color: #2ecc71;
        }

        #game-board {
            border: 4px solid #333333;
            border-radius: 8px;
            background-color: #000000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .controls-info {
            margin-top: 15px;
            font-size: 14px;
            color: #888888;
        }

        .game-over-modal {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .restart-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .restart-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>SNAKE GAME</h1>
        <div class="score-board">점수: <span id="score">0</span></div>
    </div>

    <canvas id="game-board" width="400" height="400"></canvas>

    <div class="controls-info">방향키(↑, ↓, ←, →)를 눌러 뱀을 조작하세요.</div>

    <div id="game-over" class="game-over-modal">
        <h2 style="color: #e74c3c; margin: 0;">GAME OVER</h2>
        <p>최종 점수: <span id="final-score">0</span></p>
        <button class="restart-btn" onclick="resetGame()">다시 시작</button>
    </div>

    <script>
        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('final-score');
        const gameOverModal = document.getElementById('game-over');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;

        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = GRID_SIZE;
        let dy = 0;
        let score = 0;
        let gameInterval = null;
        let isChangingDirection = false;

        function initGame() {
            snake = [
                { x: 160, y: 200 },
                { x: 140, y: 200 },
                { x: 120, y: 200 }
            ];
            dx = GRID_SIZE;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            gameOverModal.style.display = 'none';

            spawnFood();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 100);
        }

        function gameLoop() {
            if (hasGameEnded()) {
                endGame();
                return;
            }

            isChangingDirection = false;
            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                // 머리는 조금 더 밝은 색
                ctx.fillStyle = index === 0 ? '#2ecc71' : '#27ae60';
                ctx.strokeStyle = '#000000';
                ctx.fillRect(part.x, part.y, GRID_SIZE, GRID_SIZE);
                ctx.strokeRect(part.x, part.y, GRID_SIZE, GRID_SIZE);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // 먹이를 먹었는지 확인
            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            if (hasEatenFood) {
                score += 10;
                scoreElement.innerText = score;
                spawnFood();
            } else {
                snake.pop(); // 먹지 않았다면 꼬리 지우기
            }
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
            food.y = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;

            // 먹이가 뱀 몸통 위에 생기지 않도록 재귀 체크
            snake.forEach(part => {
                const hasEaten = part.x === food.x && part.y === food.y;
                if (hasEaten) spawnFood();
            });
        }

        function drawFood() {
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(food.x, food.y, GRID_SIZE, GRID_SIZE);
        }

        function hasGameEnded() {
            // 자신과의 충돌 검사
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            // 벽 충돌 검사
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= canvas.width;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= canvas.height;

            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
        }

        function endGame() {
            clearInterval(gameInterval);
            finalScoreElement.innerText = score;
            gameOverModal.style.display = 'flex';
        }

        function resetGame() {
            initGame();
        }

        // 키보드 조작 이벤트
        document.addEventListener('keydown', (e) => {
            if (isChangingDirection) return;

            const keyPressed = e.key;
            const goingUp = dy === -GRID_SIZE;
            const goingDown = dy === GRID_SIZE;
            const goingRight = dx === GRID_SIZE;
            const goingLeft = dx === -GRID_SIZE;

            if (keyPressed === 'ArrowLeft' && !goingRight) {
                dx = -GRID_SIZE;
                dy = 0;
                isChangingDirection = true;
            }
            if (keyPressed === 'ArrowUp' && !goingDown) {
                dx = 0;
                dy = -GRID_SIZE;
                isChangingDirection = true;
            }
            if (keyPressed === 'ArrowRight' && !goingLeft) {
                dx = GRID_SIZE;
                dy = 0;
                isChangingDirection = true;
            }
            if (keyPressed === 'ArrowDown' && !goingUp) {
                dx = 0;
                dy = GRID_SIZE;
                isChangingDirection = true;
            }
        });

        initGame();
    </script>
</body>
</html>
